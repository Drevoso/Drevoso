<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Drevoso — terminal vibecoder">
  <title>Drevoso — terminal vibecoder</title>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-8%" y="-10%" width="116%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#4ade80" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0.75" y="0.75" width="878.5" height="498.5" rx="14" fill="#070b09" stroke="#1d3a2a" stroke-width="1.5" filter="url(#halo)"/>
  <line x1="1" y1="44" x2="879" y2="44" stroke="#123024" stroke-width="1.5"/>
  <circle cx="24" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="68" cy="22" r="5" fill="#27c93f"/>

  <g font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="16">
    <text x="856" y="27" text-anchor="end" font-size="13" fill="#3f6b52">drevoso@github:~$</text>

    <text x="36" y="82"><tspan fill="#4ade80">$</tspan><tspan fill="#eafff3"> whoami</tspan></text>
    <text x="36" y="112"><tspan fill="#3f6b52">&gt;</tspan><tspan fill="#eafff3" font-weight="bold"> DREVOSO</tspan></text>

    <text x="36" y="152"><tspan fill="#4ade80">$</tspan><tspan fill="#eafff3"> status --atual</tspan></text>
    <text x="36" y="182" fill="#3f6b52">&gt;</text>
    <text x="55" y="182" fill="#4ade80" font-weight="bold" filter="url(#glow)">VIBECODER</text>
    <rect x="152" y="168" width="9" height="17" rx="1" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="36" y="222"><tspan fill="#4ade80">$</tspan><tspan fill="#eafff3"> sobre --curto</tspan></text>
    <text x="36" y="252"><tspan fill="#3f6b52">&gt;</tspan><tspan fill="#eafff3"> "Dev profissional de Roblox Studio.</tspan></text>
    <text x="36" y="282" xml:space="preserve"><tspan fill="#3f6b52">&gt;</tspan><tspan fill="#eafff3">  Luau é meu terreno, Rust é meu estudo,</tspan></text>
    <text x="36" y="312" xml:space="preserve"><tspan fill="#3f6b52">&gt;</tspan><tspan fill="#eafff3">  e agentes de IA são meu playground."</tspan></text>

    <text x="36" y="352"><tspan fill="#4ade80">$</tspan><tspan fill="#eafff3"> perfil --listar</tspan></text>
    <text x="54" y="382" fill="#6ee7a8">luau</text>
    <text x="210" y="382" fill="#4ade80">██████████</text>
    <text x="336" y="382" font-size="13" fill="#3f6b52">profissional · Roblox Studio</text>

    <text x="54" y="412" fill="#6ee7a8">agentes de ia</text>
    <text x="210" y="412"><tspan fill="#4ade80">████████</tspan><tspan fill="#1d3a2a">░░</tspan></text>
    <text x="336" y="412" font-size="13" fill="#3f6b52">criando aplicações</text>

    <text x="54" y="442" fill="#6ee7a8">rust</text>
    <text x="210" y="442"><tspan fill="#4ade80">██</tspan><tspan fill="#1d3a2a">░░░░░░░░</tspan></text>
    <text x="336" y="442" font-size="13" fill="#3f6b52">aprendendo o básico</text>

    <text x="36" y="472" fill="#4ade80">$</text>
    <rect x="55" y="458" width="9" height="17" rx="1" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
